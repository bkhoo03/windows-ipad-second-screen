<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>iPad Second Screen</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #000; overflow: hidden;
    font-family: -apple-system, system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  #screen {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
    object-fit: contain;      /* "fit" mode */
    background: #000;
  }
  #screen.fill { object-fit: fill; }

  #status {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px;
    color: #ddd; text-align: center; padding: 24px;
    transition: opacity .3s ease;
  }
  #status.hidden { opacity: 0; pointer-events: none; }
  #status h1 { font-size: 20px; font-weight: 600; margin: 0; }
  #status p { font-size: 14px; color: #999; margin: 0; max-width: 320px; }
  .spinner {
    width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid #333; border-top-color: #4a9eff;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #controls {
    position: absolute; top: env(safe-area-inset-top, 12px); right: 14px;
    display: flex; gap: 10px; z-index: 10;
    opacity: 0; transition: opacity .25s ease;
  }
  #controls.show { opacity: 1; }
  #controls button {
    background: rgba(30,30,30,.85); color: #eee; border: 1px solid #444;
    border-radius: 10px; padding: 9px 14px; font-size: 14px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  #controls button:active { background: rgba(70,70,70,.9); }

  #hint {
    position: absolute; bottom: env(safe-area-inset-bottom, 16px); left: 0; right: 0;
    text-align: center; color: #555; font-size: 12px;
    opacity: 0; transition: opacity .25s ease; pointer-events: none;
  }
  #hint.show { opacity: 1; }
</style>
</head>
<body>
  <canvas id="screen"></canvas>

  <div id="controls">
    <button id="btn-mode">Fill</button>
    <button id="btn-fs">Fullscreen</button>
  </div>
  <div id="hint">tap once to show controls</div>

  <div id="status">
    <div class="spinner"></div>
    <h1>Connecting…</h1>
    <p id="status-detail">Reaching your PC. Make sure the server is running and both devices are on the same WiFi.</p>
  </div>

<script>
(function () {
  const WS_PORT = "__WS_PORT__";
  const wsUrl = `ws://${location.hostname}:${WS_PORT}`;

  const canvas = document.getElementById("screen");
  const ctx = canvas.getContext("2d", { alpha: false });
  const statusEl = document.getElementById("status");
  const statusDetail = document.getElementById("status-detail");
  const controls = document.getElementById("controls");
  const hint = document.getElementById("hint");
  const btnMode = document.getElementById("btn-mode");
  const btnFs = document.getElementById("btn-fs");

  let ws = null;
  let reconnectTimer = null;
  let fillMode = false;
  let framesReceived = 0;

  // Keep the canvas backing store matched to the CSS size (for crispness).
  function sizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(window.innerWidth * dpr);
    canvas.height = Math.round(window.innerHeight * dpr);
  }
  window.addEventListener("resize", sizeCanvas);
  sizeCanvas();

  // Draw an ImageBitmap onto the canvas honoring fit/fill.
  function draw(bitmap) {
    const cw = canvas.width, ch = canvas.height;
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, cw, ch);

    if (fillMode) {
      ctx.drawImage(bitmap, 0, 0, cw, ch);
    } else {
      const scale = Math.min(cw / bitmap.width, ch / bitmap.height);
      const w = bitmap.width * scale;
      const h = bitmap.height * scale;
      const x = (cw - w) / 2;
      const y = (ch - h) / 2;
      ctx.drawImage(bitmap, x, y, w, h);
    }
    bitmap.close && bitmap.close();
  }

  function showStatus(title, detail) {
    statusEl.querySelector("h1").textContent = title;
    if (detail) statusDetail.textContent = detail;
    statusEl.classList.remove("hidden");
  }
  function hideStatus() {
    statusEl.classList.add("hidden");
  }

  function connect() {
    clearTimeout(reconnectTimer);
    showStatus("Connecting…");

    try {
      ws = new WebSocket(wsUrl);
    } catch (e) {
      scheduleReconnect();
      return;
    }
    ws.binaryType = "blob";

    ws.onopen = () => {
      // Wait for the first frame before hiding the overlay.
      showStatus("Connected", "Waiting for the first frame…");
    };

    ws.onmessage = async (ev) => {
      try {
        const bmp = await createImageBitmap(ev.data);
        framesReceived++;
        if (framesReceived === 1) hideStatus();
        draw(bmp);
      } catch (e) {
        // Ignore a bad frame; the next one will arrive shortly.
      }
    };

    ws.onclose = () => scheduleReconnect();
    ws.onerror = () => { try { ws.close(); } catch (e) {} };
  }

  function scheduleReconnect() {
    framesReceived = 0;
    showStatus("Reconnecting…",
      "Lost the connection. Retrying automatically. Check that server.py is still running.");
    clearTimeout(reconnectTimer);
    reconnectTimer = setTimeout(connect, 1500);
  }

  // ---- Controls: show on tap, auto-hide ----
  let hideControlsTimer = null;
  function flashControls() {
    controls.classList.add("show");
    hint.classList.remove("show");
    clearTimeout(hideControlsTimer);
    hideControlsTimer = setTimeout(() => controls.classList.remove("show"), 3000);
  }
  document.body.addEventListener("click", (e) => {
    if (e.target.tagName === "BUTTON") return;
    flashControls();
  });
  // Show a one-time hint at the start.
  setTimeout(() => {
    hint.classList.add("show");
    setTimeout(() => hint.classList.remove("show"), 3500);
  }, 1200);

  btnMode.addEventListener("click", () => {
    fillMode = !fillMode;
    btnMode.textContent = fillMode ? "Fit" : "Fill";
    flashControls();
  });

  btnFs.addEventListener("click", async () => {
    try {
      if (!document.fullscreenElement && canvas.requestFullscreen) {
        await canvas.requestFullscreen();
      } else if (document.exitFullscreen) {
        await document.exitFullscreen();
      }
    } catch (e) { /* Safari on iPhone lacks this; Add-to-Home-Screen is the fallback */ }
    flashControls();
  });

  // ---- Keep the screen awake while streaming ----
  let wakeLock = null;
  async function requestWakeLock() {
    try {
      if ("wakeLock" in navigator) {
        wakeLock = await navigator.wakeLock.request("screen");
      }
    } catch (e) { /* not supported / denied */ }
  }
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") {
      requestWakeLock();
      if (!ws || ws.readyState > 1) connect();
    }
  });

  requestWakeLock();
  connect();
})();
</script>
</body>
</html>
